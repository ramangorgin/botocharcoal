[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "botocharcoal"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "gunicorn==22.0.0",
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "redis==5.0.4",
    "celery[redis]==5.4.0",
    "httpx==0.27.0",
    "jinja2==3.1.4",
    "python-dotenv==1.0.1",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "python-slugify==8.0.4",
    "Pillow==10.3.0",
    "tenacity==8.3.0",
    "openai==1.30.1",
    "itsdangerous==2.2.0",
    "structlog==24.2.0",
    "pydantic-settings==2.2.1",
    "aiofiles==23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.0",
]

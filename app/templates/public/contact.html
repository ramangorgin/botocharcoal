{% extends "base.html" %}
{% block title %}تماس با ما | زغال بوتو{% endblock %}
{% block content %}
<div class="container contact-page">
  <h1>تماس با ما</h1>
  {% if success %}
  <div class="alert-success">پیام شما دریافت شد. به زودی با شما تماس می‌گیریم.</div>
  {% endif %}
  {% if error %}
  <div class="alert-error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/contact">
    <div class="form-group">
      <label>نام</label>
      <input type="text" name="name" placeholder="نام شما">
    </div>
    <div class="form-group">
      <label>شماره تماس *</label>
      <input type="tel" name="phone" required placeholder="09xxxxxxxxx">
    </div>
    <div class="form-group">
      <label>شهر</label>
      <input type="text" name="city" placeholder="شهر شما">
    </div>
    <div class="form-group">
      <label>پیام</label>
      <textarea name="message" rows="4" placeholder="توضیحات یا سوال شما"></textarea>
    </div>
    <button type="submit" class="btn-primary">ارسال</button>
  </form>
</div>
{% endblock %}

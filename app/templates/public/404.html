{% extends "base.html" %}

{% block title %}صفحه یافت نشد | بوتو زغال{% endblock %}

{% block content %}

<!-- ═══════════════════════════════════════════════════════
     404 Full-Page Error
     ═══════════════════════════════════════════════════════ -->
<section style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: var(--sp-4xl) var(--sp-lg); background: radial-gradient(ellipse at center, rgba(230, 81, 0, 0.05) 0%, transparent 70%);">
  <div style="text-align: center; max-width: 640px; margin: 0 auto;">

    <!-- Ember Animation -->
    <div style="margin-top: 30px; margin-bottom: var(--sp-2xl); position: relative; display: inline-block;">
      <div style="font-size: 8rem; line-height: 1; font-weight: var(--fw-black); background: linear-gradient(135deg, var(--clr-ember), var(--clr-burnt-red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; opacity: 0.9;">
        ۴۰۴
      </div>
      <!-- Subtle glow -->
      <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 200px; background: radial-gradient(circle, rgba(230, 81, 0, 0.15) 0%, transparent 70%); border-radius: 50%; z-index: -1;"></div>
    </div>

    <h1 style="font-size: var(--fs-2xl); font-weight: var(--fw-bold); margin-bottom: var(--sp-lg); color: var(--clr-text);">
      صفحه‌ای که جستجو می‌کنید وجود ندارد
    </h1>


    <div style="display: flex; gap: var(--sp-md); justify-content: center; flex-wrap: wrap; margin-bottom: 50px; margin-top: 50px;">
      <a href="/" class="btn btn-primary btn--lg">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        بازگشت به خانه
      </a>

    </div>


  </div>
</section>

{% endblock %}

{% block scripts %}
<style>
.quick-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-xl);
  background: var(--clr-surface);
  border: 1px solid var(--clr-border);
  border-radius: var(--radius-lg);
  text-decoration: none;
  color: var(--clr-text);
  transition: var(--transition-normal);
}

.quick-link:hover {
  border-color: var(--clr-ember);
  background: rgba(230, 81, 0, 0.05);
  transform: translateY(-2px);
}

.quick-link__icon {
  font-size: var(--fs-2xl);
}

.quick-link span {
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
}
</style>
{% endblock %}

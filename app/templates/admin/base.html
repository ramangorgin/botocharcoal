<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <meta name="description" content="پنل مدیریت بوتوچارکول">
    <title>{% block title %}پنل مدیریت | بوتوچارکول{% endblock %}</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/favicon-16x16.png">
    <link rel="shortcut icon" href="/static/favicons/favicon.ico">

    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/vendors/sweetalert2/sweetalert2.min.css">

    {% block head %}{% endblock %}
</head>
<body class="admin-body">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
            <a href="/admin/dashboard" class="admin-brand">
                <img src="/static/logos/logo-transparent.png" alt="BOTOCHARCOAL" class="admin-brand__logo">
                <div class="admin-brand__meta">
                    <span class="admin-brand__title">پنل مدیریت</span>
                    <span class="admin-brand__subtitle">بوتوچارکول</span>
                </div>
            </a>
        </div>

        <nav class="admin-nav" aria-label="منوی مدیریت">
            <ul class="admin-nav__list">
                <li class="admin-nav__item">
                    <a href="/admin/dashboard" class="admin-nav__link {% if request.url.path == '/admin/dashboard' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        <span>داشبورد</span>
                    </a>
                </li>
                <li class="admin-nav__item">
                    <a href="/admin/posts" class="admin-nav__link {% if '/admin/posts' in request.url.path %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                        <span>پست‌ها</span>
                    </a>
                </li>
                <li class="admin-nav__item">
                    <a href="/admin/jobs" class="admin-nav__link {% if '/admin/jobs' in request.url.path %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        <span>فرآیندها</span>
                    </a>
                </li>
            </ul>

            <div class="admin-nav__divider"></div>

            <ul class="admin-nav__list">
                <li class="admin-nav__item">
                    <a href="/" class="admin-nav__link" target="_blank">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                        <span>مشاهده سایت</span>
                    </a>
                </li>
                <li class="admin-nav__item">
                    <a href="/admin/logout" class="admin-nav__link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        <span>خروج</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="admin-sidebar-footer">
            <p class="admin-sidebar__copyright">© 2026 بوتوچارکول</p>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="admin-main">
        <!-- Admin Header -->
        <header class="admin-header">
            <div class="admin-header__inner">
                <button class="admin-sidebar-toggle" id="sidebarToggle" aria-label="باز/بستن منو">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <h1 class="admin-header__title">{% block header_title %}داشبورد{% endblock %}</h1>
                <div class="admin-header__actions">
                    <a href="/" class="admin-header__home-btn" title="مشاهده سایت" target="_blank">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <!-- Admin Content -->
        <main class="admin-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Container -->
    <div class="admin-toast-container" id="toastContainer"></div>

    <!-- Preloader -->
    <div class="preloader admin-preloader" id="adminPreloader" aria-label="در حال بارگذاری">
        <div class="preloader__inner">
            <img src="/static/logos/logo-transparent.png" alt="BOTOCHARCOAL" class="preloader__logo">
            <div class="preloader__ring"></div>
            <p class="preloader__text">Botocharcoal</p>
        </div>
    </div>

    <!-- Scripts -->
    <script>
    // Set CSRF token from cookies
    (function() {
        const cookies = document.cookie.split(';');
        for (let c of cookies) {
            const [key, value] = c.trim().split('=');
            if (key === 'csrf_token') {
                const meta = document.querySelector('meta[name="csrf-token"]');
                if (meta) meta.content = decodeURIComponent(value);
                break;
            }
        }
    })();
    </script>
    <script src="/static/vendors/sweetalert2/sweetalert2.min.js"></script>
    <script src="/static/js/admin.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

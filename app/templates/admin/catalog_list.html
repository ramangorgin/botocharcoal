{% extends "base.html" %}
{% block title %}کاتالوگ‌ها{% endblock %}
{% block content %}
<h1>کاتالوگ‌ها</h1>

<form method="post" action="/admin/catalog/upload" enctype="multipart/form-data" class="admin-form">
  <div class="form-group">
    <label>عنوان کاتالوگ</label>
    <input type="text" name="title" required placeholder="مثال: کاتالوگ محصولات ۱۴۰۵">
  </div>
  <div class="form-group">
    <label>فایل PDF</label>
    <input type="file" name="file" accept=".pdf" required>
  </div>
  <button type="submit" class="btn-primary">آپلود</button>
</form>

<table class="data-table" style="margin-top:2rem">
  <thead>
    <tr><th>عنوان</th><th>لینک</th><th>تاریخ</th></tr>
  </thead>
  <tbody>
    {% for cat in catalogs %}
    <tr>
      <td>{{ cat.title }}</td>
      <td><a href="{{ cat.public_url }}" target="_blank">دانلود</a></td>
      <td>{{ cat.created_at.strftime('%Y-%m-%d') }}</td>
    </tr>
    {% else %}
    <tr><td colspan="3">کاتالوگی آپلود نشده است.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

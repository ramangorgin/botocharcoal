<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="پنل مدیریت بوتوچارکول">
    <title>{% block title %}ورود مدیر | بوتوچارکول{% endblock %}</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/favicon-16x16.png">
    <link rel="shortcut icon" href="/static/favicons/favicon.ico">

    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/admin.css">

    {% block head %}{% endblock %}
</head>
<body class="admin-body">
    {% block content %}
    <section class="admin-login-page">
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <img src="/static/logos/logo-transparent.png" alt="BOTOCHARCOAL" class="admin-login-logo">
                <h1 class="admin-login-title">پنل مدیریت بوتوچارکول</h1>
                <p class="admin-login-subtitle">لطفاً اطلاعات ورود خود را وارد کنید</p>
            </div>

            {% if error %}
            <div class="admin-alert admin-alert-error" id="loginAlert">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" action="/admin/login" class="admin-login-form" id="loginForm">
                <div class="admin-form-group">
                    <label for="username" class="admin-form-label">نام کاربری</label>
                    <input type="text" id="username" name="username" class="admin-form-input" placeholder="نام کاربری خود را وارد کنید" required autocomplete="username" autofocus>
                </div>

                <div class="admin-form-group">
                    <label for="password" class="admin-form-label">رمز عبور</label>
                    <div class="admin-password-wrapper">
                        <input type="password" id="password" name="password" class="admin-form-input" placeholder="رمز عبور خود را وارد کنید" required autocomplete="current-password">
                        <button type="button" class="admin-toggle-password" onclick="togglePassword()" aria-label="نمایش رمز عبور">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="admin-btn admin-btn-primary admin-btn-full" id="loginBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    <span>ورود به پنل</span>
                </button>
            </form>
        </div>
    </div>
</section>
    {% endblock %}

    <!-- Toast Container -->
    <div class="admin-toast-container" id="toastContainer"></div>

    <script src="/static/js/admin.js"></script>
    {% block scripts %}
    <script>
    function togglePassword() {
        const pwd = document.getElementById('password');
        const eye = document.getElementById('eyeIcon');
        const eyeOff = document.getElementById('eyeOffIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            eye.style.display = 'none';
            eyeOff.style.display = 'block';
        } else {
            pwd.type = 'password';
            eye.style.display = 'block';
            eyeOff.style.display = 'none';
        }
    }

    // Show alert if error exists
    document.addEventListener('DOMContentLoaded', function() {
        const alert = document.getElementById('loginAlert');
        if (alert) {
            alert.style.opacity = '1';
            setTimeout(function() {
                alert.style.opacity = '0';
                setTimeout(function() {
                    alert.style.display = 'none';
                }, 400);
            }, 5000);
        }
    });
    </script>
    {% endblock %}
</body>
</html>
